[Main]
run_type = trainFF
trajectory_file = train.traj
scaler_type = NoScaler
energy_training = True
force_training = True
use_cohesive_energy = False
adjust = False
restart = False
ifelectronegativity = True
ifhardness = True
if_short = True
if_long = True
chg_grad = True
real_space_cut = 0.0
total_ion_charge = 0.0
es_frac = 1.0
en_frac = 1.0
fp_timer = exp
fp_timer_a = 0.5
test_log_interval = 100
epochs_max = 20000

[Parallelization]
process_num = 64
batch_num_per_proc = 1
thread_num = 1
device_type = CPU

[Fingerprints]
fp_type = BP
fp_parameter_file = fpParas.dat
fp_use_existing = False
fp_dir = fingerprints
fp_batch_num = 1

[MachineLearningModel]
model_type = neural_network
hidden_layers = 96 16
activation_function = tanh

[LossFunction]
loss_type = SE
energy_coefficient = 100.0
force_coefficient = 1.0

[Optimizer]
optimizer_type = LBFGS
learning_rate = 0.1

[Debug]
init_model_parameters = False
nn_values = False
use_deterministic = False
